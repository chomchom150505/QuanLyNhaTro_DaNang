<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân</title>

    <link rel="stylesheet" href="ThongTinCaNhan.css">
</head>

<body>

<div class="page">

    <!-- Menu bên trái -->
    <div class="sidebar">
        <div class="menu active">👤 Quản lý thông tin cá nhân</div>
        <div class="menu">▣ Đổi mật khẩu</div>
    </div>

    <!-- Nội dung bên phải -->
    <div class="main">

        <p class="title">Quản lý thông tin cá nhân</p>

        <div class="card">

            <!-- Thông tin người dùng -->
            <div class="profile">

                <div class="avatar">👤</div>

                <div>
                    <h2>Nguyễn Văn A</h2>
                    <p>0123456789</p>
                    <button>Đổi ảnh đại diện</button>
                </div>

            </div>

            <!-- Form -->
            <div class="form">

                <div class="row">
                    <label>Họ tên:</label>
                    <input value="Nguyễn Văn A">
                </div>

                <div class="row">
                    <label>Email:</label>
                    <input value="abc@gmail.com">
                </div>

                <div class="row">
                    <label>CCCD:</label>
                    <input value="1234567890987">
                </div>

                <div class="row">
                    <label>Số điện thoại:</label>
                    <input value="0123456789">
                </div>

                <div class="row">
                    <label>Địa chỉ:</label>
                    <input value="Thanh Khê, Đà Nẵng">
                </div>

                <button class="save">Lưu thay đổi</button>

            </div>

        </div>
    </div>

</div>

</body>
</html>
